<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartões – O Sustento da Obra de Deus</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF3FB;--ink:#12263F;--mute:#53607a;--front:#1D4F80;--front-ink:#F3F5FF;--gold:#8FCBFF;--back:#fff;--line:#C3D7EA;--teal:#2B6FA8;--chip:#DCEAF7;--ok:#2B6FA8;--rev:#B4472F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A2B;--ink:#E8EDF7;--mute:#9aa8c4;--front:#2A6AA8;--back:#14263B;--line:#2A4560;--teal:#7CC0FF;--chip:#173049;--ok:#7CC0FF;--rev:#F08A6F}}
:root[data-theme="dark"]{--bg:#0C1A2B;--ink:#E8EDF7;--mute:#9aa8c4;--front:#2A6AA8;--back:#14263B;--line:#2A4560;--teal:#7CC0FF;--chip:#173049;--ok:#7CC0FF;--rev:#F08A6F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:20px 16px 32px}
.head{display:flex;gap:14px;align-items:center;margin-bottom:14px}.head .sub{margin:0}.logo{width:92px;height:92px;object-fit:contain;background:#fff;border-radius:16px;padding:8px;flex:none;border:1.5px solid var(--line)}
h1{font:700 26px/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tool{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 12px;font:400 15px "Atkinson Hyperlegible",sans-serif;cursor:pointer;min-height:40px}
.tool[aria-pressed=true]{border-color:var(--teal);color:var(--teal);font-weight:700}
.bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.stat{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:12px}
.scene{perspective:1200px}
.card{position:relative;width:100%;height:430px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);display:block;text-align:left;font:inherit;color:inherit}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.front{background:var(--front);color:var(--front-ink);border-left:8px solid var(--gold);justify-content:center}
.back{background:var(--back);border:2px solid var(--teal);transform:rotateY(180deg)}
.tag{font:700 14px "Atkinson Hyperlegible",sans-serif;margin-bottom:10px;color:var(--gold)}
.back .tag{color:var(--teal)}
.q{font:700 25px/1.25 "Bricolage Grotesque",sans-serif;margin:0}
.a{font-size:16.5px;line-height:1.45}
.a p{margin:0 0 8px}.a ul{margin:0 0 8px;padding-left:20px}.a li{margin-bottom:6px}
.ref{margin-top:auto;padding-top:8px;font-weight:700;color:var(--teal);font-size:15px}
.hint{margin-top:18px;font-size:14px;opacity:.7}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 10px;font:700 16px "Atkinson Hyperlegible",sans-serif;cursor:pointer;min-height:48px;background:var(--chip);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}.btn.rev{background:var(--rev);color:#fff}
[data-theme="dark"] .btn.ok,[data-theme="dark"] .btn.rev{color:#0C1A2B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.rev{color:#0C1A2B}}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{padding:36px 20px;text-align:center;border:2px dashed var(--line);border-radius:20px}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
@media (max-width:420px){.q{font-size:22px}.a{font-size:16px}.card{height:480px}}
</style>
</head>

<p class="sub">9 cartões · Toque no cartão para virar.</p></div></div>
<div class="tools">
<button class="tool" id="shuf" aria-pressed="false">Embaralhar</button>
<button class="tool" id="rev" aria-pressed="false">Só os que preciso revisar</button>
<button class="tool" id="reset">Zerar</button>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="stat"><span id="pos"></span><span id="kn"></span></div>
<div id="stage"></div>
<div class="row">
<button class="btn" id="prev">Anterior</button>
<button class="btn" id="flipb">Virar</button>
<button class="btn" id="next">Próximo</button>
</div>
<div class="row">
<button class="btn rev" id="bRev" disabled>Preciso revisar</button>
<button class="btn ok" id="bOk" disabled>Já sei</button>
</div>
</main>
<script>
const C=[
["Por que Deus conta com a gente para sustentar a Sua obra, se Ele é o dono de tudo?","<p>Ele poderia sustentar tudo sozinho, mas escolheu nos dar essa tarefa. Somos <b>mordomos</b>: administradores do que é dEle.</p>","Tarefa que Deus nos deu"],
["O que significa cada parte de “Tragam todos os dízimos à casa do Tesouro, para que haja mantimento na minha casa”?","<ul><li><b>Tragam:</b> é uma ordem. Cada um faz a sua parte.</li><li><b>Todos os dízimos:</b> os 10% inteiros, não 5% nem só uma parte.</li><li><b>Casa do Tesouro:</b> a igreja local, onde você é alimentado na fé.</li><li><b>Mantimento:</b> o que a igreja precisa para funcionar: contas, templo, EBD, pastores, ajuda social e missões.</li><li><b>Minha casa:</b> o dízimo é recebido por Deus, e os líderes prestam contas a Ele.</li></ul>","Malaquias 3:10a"],
["O que é o dízimo?","<p>É a <b>décima parte (10%)</b> do que recebemos. Não é uma doação, é uma <b>devolução</b>: esse valor já pertence a Deus.</p>","Malaquias 3:10"],
["O dízimo existe só no Antigo Testamento?","<p>Não. Aparece <b>antes da Lei</b> (Abraão e Jacó), <b>na Lei</b> (para sustentar os levitas) e no <b>Novo Testamento</b>, quando Jesus diz que ele não deve ser deixado de lado.</p>","Gn 14:18-20; Nm 18:21; Mt 23:23"],
["Por que Deus disse que o povo estava “roubando” Ele?","<p>Porque o povo retinha o <b>dízimo e as ofertas</b>, que pertencem a Deus. Isso mostrava um coração longe dEle.</p>","Malaquias 3:8-9"],
["Para onde o dízimo deve ser levado, segundo Malaquias 3:10?","<p>Para a <b>“casa do Tesouro”</b>: a igreja local, onde a pessoa é alimentada na fé. Ali ele ajuda a pagar as contas, os materiais e as missões.</p>","Malaquias 3:10"],
["Que desafio único Deus faz ao Seu povo em Malaquias 3:10?","<p>“<b>Ponham-me à prova</b>”: testar a fidelidade dEle. Ele promete abrir as janelas do céu e proteger o fruto do trabalho. Mas devolvemos por amor e gratidão, não para negociar.</p>","Malaquias 3:10"],
["Por que deixar o dízimo para “o que sobrar no fim do mês” não funciona?","<p>Porque raramente sobra. O certo é separar o dízimo <b>primeiro</b>, assim que o dinheiro chega: as <b>primícias</b>.</p>","Provérbios 3:9"],
["Qual a diferença entre dízimo e oferta?","<p><b>Dízimo:</b> é um dever, os 10% que Deus estabeleceu.<br><b>Oferta:</b> é voluntária, não tem valor fixo e deve ser dada com alegria.</p>","2 Coríntios 9:7"]
].map((c,i)=>({id:i,q:c[0],a:c[1],r:c[2]}));
let onlyRev=false,shuf=false,idx=0,flip=false,known={},perm=C.map(c=>c.id);
try{known=JSON.parse(localStorage.getItem('sustento-known')||'{}')}catch(e){known={}}
const save=()=>{try{localStorage.setItem('sustento-known',JSON.stringify(known))}catch(e){}};
const $=id=>document.getElementById(id);
function shuffle(){perm=C.map(c=>c.id);for(let i=perm.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}}
function deck(){let d=C.filter(c=>!onlyRev||!known[c.id]);if(shuf)d.sort((a,b)=>perm.indexOf(a.id)-perm.indexOf(b.id));return d}
function render(){
const d=deck();if(idx>=d.length)idx=0;
const kn=C.filter(c=>known[c.id]).length;
$('bar').style.width=kn/C.length*100+'%';$('kn').textContent=kn+' de '+C.length+' dominados';
if(!d.length){$('stage').innerHTML='<div class="empty"><p class="q">Tudo dominado!</p><p>Desative “Só os que preciso revisar” ou zere para estudar de novo.</p></div>';$('pos').textContent='';['flipb','prev','next','bOk','bRev'].forEach(i=>$(i).disabled=true);return}
const c=d[idx];
$('pos').textContent='Cartão '+(idx+1)+' de '+d.length;
$('stage').innerHTML='<div class="scene"><button class="card'+(flip?' flip':'')+'" id="card" aria-label="Cartão. Toque para virar."><div class="face front"><div class="tag">Pergunta '+(c.id+1)+'</div><p class="q">'+c.q+'</p><div class="hint">Toque para ver a resposta</div></div><div class="face back" aria-hidden="'+!flip+'"><div class="tag">Resposta</div><div class="a">'+c.a+'</div><div class="ref">'+c.r+'</div></div></button></div>';
$('card').onclick=toggle;
['prev','next','flipb'].forEach(i=>$(i).disabled=false);
$('bOk').disabled=$('bRev').disabled=!flip;$('flipb').textContent=flip?'Ver pergunta':'Virar';
}
function toggle(){flip=!flip;$('card').classList.toggle('flip',flip);$('bOk').disabled=$('bRev').disabled=!flip;$('flipb').textContent=flip?'Ver pergunta':'Virar';document.querySelector('.back').setAttribute('aria-hidden',!flip)}
function go(n){const d=deck();if(!d.length)return;idx=(idx+n+d.length)%d.length;flip=false;render()}
function mark(v){const d=deck();if(!d.length)return;known[d[idx].id]=v;save();flip=false;if(!(onlyRev&&v))idx=(idx+1)%Math.max(deck().length,1);render()}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('flipb').onclick=()=>{if($('card'))toggle()};
$('bOk').onclick=()=>mark(true);$('bRev').onclick=()=>mark(false);
$('shuf').onclick=e=>{shuf=!shuf;if(shuf)shuffle();e.currentTarget.setAttribute('aria-pressed',shuf);idx=0;flip=false;render()};
$('rev').onclick=e=>{onlyRev=!onlyRev;e.currentTarget.setAttribute('aria-pressed',onlyRev);idx=0;flip=false;render()};
$('reset').onclick=()=>{known={};save();idx=0;flip=false;render()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if((e.key===' '||e.key==='Enter')&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();if($('card'))toggle()}});
render();
</script>
